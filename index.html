<!doctype html>
<html>
  <head>
    <title>Mufasa Store</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <div class="logo">
        <img src="./Images/Logo.png" alt="" />
      </div>
      <div class="navs">
        <p class="nav">Home</p>
        <p class="nav">Payments</p>
      </div>
    </header>

    <main>
      <section>
        <div class="home-pic">
          <img src="./Images/Clothing store.png" alt="" />

          <div class="home-pic-description">
            <h3>The House Of Fashion</h3>
            <h1>Discover Shoes &amp; Clothing Made for you</h1>
            <p>clothing &#43; lifestyle &#61; Identity</p>
          </div>
          <div class="explore">
            <button class="explore-button">Explore more</button>
          </div>
        </div>
      </section>

      <section>
        <div class="top-collection">
          <h5>TOP COLLECTION</h5>
          <h2>Explore Our Credentials</h2>
        </div>
        <div class="credentials-grid">
          <div class="credentials">
            <img src="./Images/big converse.jpeg" alt="" />
            <div class="credentials-details">
              <p>Max-converse</p>
              <p><strong>(30,000 RWF)</strong></p>
            </div>
          </div>
          <div class="credentials">
            <img src="./Images/Busta.jpeg" alt="" />
            <div class="credentials-details">
              <p>Adidas Yeezy</p>
              <p><strong>(45,000 RWF)</strong></p>
            </div>
          </div>
          <div class="credentials">
            <img src="./Images/Mini timber.jpeg" alt="" />
            <div class="credentials-details">
              <p>Mini-Timberland</p>
              <p><strong>(60,000 RWF)</strong></p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
